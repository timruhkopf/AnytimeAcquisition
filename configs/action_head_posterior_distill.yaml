# Top-level Hydra config for pipelines/action_head_posterior_distill.py --
# separate composition from configs/config.yaml and configs/train_pfn.yaml,
# same reasoning as train_pfn.yaml's own header: this pipeline doesn't touch
# benchmarks or the EXIT trainer, and it doesn't train a PFN either -- it
# loads an already-trained, frozen one (configs/pfn_checkpoint/, a named,
# self-describing pointer -- see that group's smoke_xdim1.yaml) and trains
# only an ActionHead against a closed-form target read off that PFN's own
# posterior. See the pipeline module's docstring for the full "why" (the
# confidence-building toy problem this de-risks before Phase 5's real
# privileged-search targets).
#
# `priors.x_dim` interpolates from `pfn_checkpoint.max_x_dim` (can't drift
# out of sync by construction -- main() still validates the descriptor's
# whole architecture against the checkpoint's own ckpt["config"], since a
# stale/hand-edited-wrong descriptor file is still possible). Swap to a
# different trained checkpoint via `pfn_checkpoint=<name>` (add a
# configs/pfn_checkpoint/<name>.yaml descriptor for it first) rather than
# overriding checkpoint_path/priors.x_dim directly, e.g.:
#   uv run python -m anytimeacquisition.pipelines.action_head_posterior_distill \
#     experiment=action_head_posterior_distill_bigscale
defaults:
  - priors: bnn
  - pfn_checkpoint: smoke_xdim1
  - callbacks: mlflow
  - _self_
  - optional experiment: null

seed: 0
allow_dirty: false

# Anchored to the aa_root resolver (registered by src/anytimeacquisition/paths.py,
# import side effect of anytimeacquisition/__init__.py) rather than Hydra's
# default cwd-relative `outputs/...` -- keeps run dirs a top-level, gitignored
# sibling of `src/` regardless of the invocation cwd (e.g. an IDE run config
# defaulting to the script's own directory).
hydra:
  run:
    dir: ${aa_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${aa_root:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Own MLflow experiment, separate from the "anytimeacquisition" one M2's
# PFN-training runs use -- these are diagnostic ActionHead runs against an
# already-frozen checkpoint, not trained models worth mixing into the same
# experiment view.
callbacks:
  mlflow:
    experiment_name: anytimeacquisition-action-head-posterior-distill

priors:
  x_dim: ${pfn_checkpoint.max_x_dim}
  batch_size: 16

n_train_context: 10
memorize_steps: 300
generalize_steps: 600
eval_contexts: 50
# Uniform-random query points used to decode each context's closed-form
# target (bar_dist.mean argmin) -- not a grid, so this scales to any x_dim.
# Coarse at the default; bump for a higher-x_dim checkpoint so the target
# itself isn't noisy.
n_candidates: 500
lr: 3.0e-3
log_every: 50

# ActionHead's own capacity -- independent of the frozen PFN's size
# (pfn_d_model/pfn_n_layers are read from the checkpoint at runtime, not
# set here). Defaults match ActionHead's own constructor defaults.
action_head:
  d_model: 64
  n_heads: 4
  d_ff: 128
  dropout: 0.0
