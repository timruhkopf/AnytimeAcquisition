# pfn/bar_dist/prior/action_head/seed/model_config/on_log/
# extra_checkpoint_metadata/callbacks are runtime objects, passed at
# instantiate() time in pipelines/train_exit.py -- not representable in
# YAML, same pattern as trainer/pfn_trainer.yaml.
_target_: anytimeacquisition.trainer.action_head_imitation_trainer.ActionHeadImitationTrainer
n_rollouts: 500
n_init: 5
n_steps: 20
lr: 1.0e-3
log_every: 10
# Interpolated (not a runtime-only object) so instantiate(cfg.trainer, ...)
# passes it automatically -- harmless when explore_search_kwargs is null
# (the trainer never reads it in that case), so no per-experiment
# conditional needed.
build_interesting_points_kwargs: ${build_interesting_points_kwargs}
# Deliberately fewer GD steps than exploit_search's own default (50, see
# search/exploit.py) -- reduces how far the oracle can wander from what's
# plausibly reachable given the tiny context, trading search thoroughness
# for confidence in the target (mitigates
# docs/log/2026-08-28-exploit-search-target-may-outrun-context.md's "target
# may outrun context" risk; user-directed, 2026-08-31). All restarts now
# seed at (small perturbations of) the incumbent, not a global random point
# (2026-09-01, see search/exploit.py) -- n_restarts is cheap to raise a bit
# since every restart stays local.
#
# exploit_search_kwargs/explore_search_kwargs being set (a dict) vs. `null`
# is what selects which branch(es) train (2026-09-02 -- no separate
# `branches` value; see trainer/action_head_imitation_trainer.py's own
# module docstring). Override to `null` in an experiment config to turn a
# branch off, e.g. `trainer.explore_search_kwargs: null` for an
# exploit-only run.
exploit_search_kwargs:
  n_restarts: 4
  n_steps: 15
# n_restarts=1 (search/explore.py's own default): every explore-labeled
# step needs its own full n_steps-length GD trajectory through the PFN,
# and explore-labeled steps vastly outnumber exploit-labeled ones per
# rollout -- unlike exploit, extra restarts here are NOT cheap
# (2026-09-01, user-directed compute-budget call). Also now seeds at the
# rollout's own realized action, not a random draw -- see search/explore.py.
explore_search_kwargs:
  n_restarts: 1
  n_steps: 15
train_value_head: false
# "auto" (default, 2026-09-01, user-directed): DAgger mixing is on by
# default, phased in over this trainer's own n_rollouts -- round 0 pure
# random_policy, decaying to mostly self-generated by the last rollout,
# floored at dagger_beta_min residual randomness (see the trainer's own
# module docstring for the exact schedule). Set to an int to use a
# different phase-in span than n_rollouts, or null to disable mixing
# entirely (pure round-0-only random_policy throughout).
dagger_decay_rounds: auto
dagger_beta_min: 0.05
checkpoint_path: null  # set via an experiment config, or override directly
