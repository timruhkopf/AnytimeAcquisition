# pfn/bar_dist/prior/action_head/branches/seed/build_interesting_points_kwargs/
# model_config/on_log/extra_checkpoint_metadata/callbacks are runtime objects,
# passed at instantiate() time in pipelines/action_head_imitation.py -- not
# representable in YAML, same pattern as trainer/pfn_trainer.yaml.
_target_: anytimeacquisition.trainer.action_head_imitation_trainer.ActionHeadImitationTrainer
n_rollouts: 500
n_init: 5
n_steps: 20
lr: 1.0e-3
log_every: 10
# Deliberately fewer GD steps than exploit_search's own default (50, see
# search/exploit.py) -- reduces how far the oracle can wander from what's
# plausibly reachable given the tiny context, trading search thoroughness
# for confidence in the target (mitigates
# docs/log/2026-08-28-exploit-search-target-may-outrun-context.md's "target
# may outrun context" risk; user-directed, 2026-08-31). All restarts now
# seed at (small perturbations of) the incumbent, not a global random point
# (2026-09-01, see search/exploit.py) -- n_restarts is cheap to raise a bit
# since every restart stays local.
exploit_search_kwargs:
  n_restarts: 4
  n_steps: 15
# n_restarts=1 (search/explore.py's own default): every explore-labeled
# step needs its own full n_steps-length GD trajectory through the PFN,
# and explore-labeled steps vastly outnumber exploit-labeled ones per
# rollout -- unlike exploit, extra restarts here are NOT cheap
# (2026-09-01, user-directed compute-budget call). Also now seeds at the
# rollout's own realized action, not a random draw -- see search/explore.py.
explore_search_kwargs:
  n_restarts: 1
  n_steps: 15
train_value_head: false
checkpoint_path: null  # set via an experiment config, or override directly
