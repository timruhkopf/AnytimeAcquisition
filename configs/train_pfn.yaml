# Top-level Hydra config for pipelines/train_pfn.py -- separate from
# configs/config.yaml (the EXIT/policy-training composition, benchmarks +
# priors + models/surrogates + trainer) since PFN pretraining doesn't touch
# benchmarks or the EXIT trainer at all, it's a self-contained loop over
# priors + the PFN itself. See docs/milestones/M2.md.
#
# Run a named, reproducible config via `experiment=<name>` (Hydra's
# standard experiment-config pattern, configs/experiment/*.yaml), e.g.:
#   uv run python -m anytimeacquisition.pipelines.train_pfn experiment=pfn_smoke_xdim2
defaults:
  - priors: bnn
  - models/surrogates: pfn
  - trainer: pfn_trainer
  - callbacks: mlflow
  - _self_
  - optional experiment: null

seed: 0
device: cpu
allow_dirty: false

# Opt-in per-dimension validation (docs/log/2026-08-31-variable-xdim-
# training-stagnation.md): a list of x_dim values (each <= priors.x_dim) to
# report NLL/eval_mse against, via dedicated fixed-x_dim BNNPriors --
# callbacks/dim_validation.py. null (default) adds no extra callbacks, the
# ordinary case for a fixed-x_dim run; e.g. [1, 2, 3, 4] for a
# variable_dim_min run (see configs/experiment/pfn_variable_xdim_smoke.yaml).
validate_dims: null

# Own MLflow experiment -- was sharing configs/callbacks/mlflow.yaml's bare
# "anytimeacquisition" default with configs/config.yaml's EXIT/policy loop
# (a different pipeline entirely -- see this file's header), same gap
# action_head_posterior_distill.yaml/explore_search_playground.yaml already
# closed for themselves.
callbacks:
  mlflow:
    experiment_name: anytimeacquisition-pfn-pretrain

# Anchored to the aa_root resolver (registered by src/anytimeacquisition/paths.py,
# import side effect of anytimeacquisition/__init__.py) rather than Hydra's
# default cwd-relative `outputs/...` -- keeps run dirs a top-level, gitignored
# sibling of `src/` regardless of the invocation cwd (e.g. an IDE run config
# defaulting to the script's own directory).
hydra:
  run:
    dir: ${aa_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${aa_root:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
