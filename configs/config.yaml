defaults:
  - benchmarks: dummy
  - priors: dummy
  - models/surrogates: dummy
  - trainer: dummy
  - callbacks: mlflow
  - deployment: local
  - _self_

seed: 0
allow_dirty: false

# Own MLflow experiment, explicit rather than relying on
# configs/callbacks/mlflow.yaml's bare "anytimeacquisition" default -- keeps
# this pipeline's runs (the EXIT/policy loop) separate from train_pfn.yaml's
# "anytimeacquisition-pfn-pretrain" once that lands, same convention
# action_head_posterior_distill.yaml/explore_search_playground.yaml already
# use for their own experiments.
callbacks:
  mlflow:
    experiment_name: anytimeacquisition-exit-train

# Anchored to the aa_root resolver (registered by src/anytimeacquisition/paths.py,
# import side effect of anytimeacquisition/__init__.py) rather than Hydra's
# default cwd-relative `outputs/...` -- keeps run dirs a top-level, gitignored
# sibling of `src/` regardless of the invocation cwd (e.g. an IDE run config
# defaulting to the script's own directory).
hydra:
  run:
    dir: ${aa_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${aa_root:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
