# @package _global_
# Real-scale (not smoke) integrated FlowMatchingActionHead run, sized for
# pfn_variable_xdim_smoke.pt's x_dim=6 -- pair with
# pfn_checkpoint=variable_xdim_smoke on the CLI. This is the flow-matching
# counterpart to action_head_imitation_integrated_regret_kstep_real.yaml,
# comparable via the shared auc/action_head metric
# (callbacks/action_head_validation.py's build_flow_auc_eval_callback uses
# the same metric names/held-out protocol as the simple head's own
# build_auc_eval_callback) -- run both and compare auc_improvement_vs_random
# before concluding the chunked/flow architecture earns its complexity over
# the simple single-shot head (docs/MILESTONES.md's prioritized experiment
# 4 framing).
#
# Not run in this session -- confirm with the user before launching on
# ulysses/LUIS (this repo's own established practice, see CLAUDE.md).
#
#   uv run python -m anytimeacquisition.pipelines.train_exit_flow \
#     experiment=action_head_flow_integrated_real pfn_checkpoint=variable_xdim_smoke allow_dirty=true
priors:
  batch_size: 16

trainer:
  n_rollouts: 800
  n_init: 10
  n_steps: 40
  log_every: 100
  chunk_len: 3
  num_sample_steps: 10
  exploit_search_kwargs:
    n_restarts: 4
    n_steps: 15
  explore_search_kwargs:
    n_restarts: 1
    n_steps: 15
  require_improvement: true
  require_regret_improvement: true
  max_explore_steps_per_rollout: 8
  checkpoint_path: ${aa_root:}/models/action_head_flow_integrated_real.pt

build_interesting_points_kwargs:
  n_sobol: 64
  n_random: 64
  n_basin_restarts: 24

action_head_flow:
  chunk_len: 3
  d_model: 64
  n_heads: 4
  d_ff: 128
  dropout: 0.0
