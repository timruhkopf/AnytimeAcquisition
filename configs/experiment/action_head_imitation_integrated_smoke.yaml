# @package _global_
# Smoke-scale integrated ActionHead behavior-cloning run -- both branches at
# once (exploit_search on incumbent-improving steps, explore_search on flat
# steps), same random-policy rollout, same underlying trainer as the
# exploit-only/explore-only smoke configs with both branches enabled.
#
#   uv run python -m anytimeacquisition.pipelines.action_head_imitation \
#     experiment=action_head_imitation_integrated_smoke allow_dirty=true
branches: [exploit, explore]

trainer:
  n_rollouts: 300
  n_init: 5
  n_steps: 15
  log_every: 10
  exploit_search_kwargs:
    n_restarts: 6
    n_steps: 15
  explore_search_kwargs:
    n_restarts: 6
    n_steps: 15

build_interesting_points_kwargs:
  n_sobol: 12
  n_random: 12
  n_basin_restarts: 6

action_head:
  d_model: 32
  n_heads: 2
  d_ff: 64
  dropout: 0.0
