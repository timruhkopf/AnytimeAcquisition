# @package _global_
# Smoke-scale integrated FlowMatchingActionHead run -- both branches at once
# (exploit_search on incumbent-improving steps, explore_search via
# search/kstep_explore.py's k-step chunk targets on flat steps), same
# random-policy-seeded DAgger rollout as the simple-head smoke configs.
# Push-button, CPU-sized -- meant to verify the full flow-matching pipeline
# end-to-end, not to actually clear auc_improvement_vs_random (needs
# n_rollouts at real-run scale for that, see action_head_flow_integrated_real.yaml).
#
#   uv run python -m anytimeacquisition.pipelines.train_exit_flow \
#     experiment=action_head_flow_integrated_smoke allow_dirty=true
trainer:
  n_rollouts: 300
  n_init: 5
  n_steps: 15
  log_every: 10
  chunk_len: 3
  num_sample_steps: 10
  exploit_search_kwargs:
    n_restarts: 6
    n_steps: 15
  explore_search_kwargs:
    n_restarts: 1
    n_steps: 15
  require_improvement: true
  require_regret_improvement: false

build_interesting_points_kwargs:
  n_sobol: 12
  n_random: 12
  n_basin_restarts: 6

action_head_flow:
  chunk_len: 3
  d_model: 32
  n_heads: 2
  d_ff: 64
  dropout: 0.0
