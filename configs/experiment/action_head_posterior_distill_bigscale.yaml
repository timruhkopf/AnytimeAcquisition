# @package _global_
# Bigger-scale run of the ActionHead-vs-frozen-PFN posterior-distillation
# toy problem -- see pipelines/action_head_posterior_distill.py's module
# docstring for what this validates and why. This experiment file is a
# throwaway diagnostic config, not a permanent named run like the
# pfn_smoke_* experiments -- expect it to get deleted or rewritten once a
# real checkpoint (and real numbers from it) exist.
#
# checkpoint_path/priors.x_dim below still point at the tiny x_dim=1 smoke
# checkpoint as a placeholder -- swap both to the real trained checkpoint's
# path and x_dim once it's collected; everything else (steps/candidates/
# eval_contexts/action_head capacity) is already sized for a real run, not
# a smoke test.
#
# Run:
#   uv run python -m anytimeacquisition.pipelines.action_head_posterior_distill \
#     experiment=action_head_posterior_distill_bigscale
# or override the checkpoint directly without editing this file:
#   uv run python -m anytimeacquisition.pipelines.action_head_posterior_distill \
#     experiment=action_head_posterior_distill_bigscale \
#     checkpoint_path=/path/to/real_checkpoint.pt priors.x_dim=4
checkpoint_path: ${aa_root:}/models/pfn_smoke_xdim1.pt

priors:
  x_dim: 1
  batch_size: 64

n_train_context: 20
memorize_steps: 500
generalize_steps: 5000
eval_contexts: 300
n_candidates: 2000
lr: 3.0e-3
log_every: 200

action_head:
  d_model: 128
  n_heads: 4
  d_ff: 256
  dropout: 0.0
