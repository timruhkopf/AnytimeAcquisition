# @package _global_
# Real-scale integrated ActionHead run with all three of
# docs/MILESTONES.md's prioritized experiments 1-3 turned on together (this
# session's actual deliverable, not a hypothetical): the regret-based
# label-quality gate (require_regret_improvement, on top of the existing
# require_improvement proxy filter), k-step privileged planning promoted
# into training (explore_k=3, via search/kstep_explore.py), and
# round-dependent seeding (starts at "incumbent", switches to "realized"
# once dagger/frac_self_generated clears realized_seed_min_self_generated --
# see trainer/action_head_imitation_trainer.py's own docstring). Sized for
# pfn_variable_xdim_smoke.pt's x_dim=6, same base scale as
# action_head_imitation_integrated_real.yaml -- pair with
# pfn_checkpoint=variable_xdim_smoke on the CLI.
#
# Not run in this session -- confirm with the user before launching on
# ulysses/LUIS (this repo's own established practice, see CLAUDE.md).
#
#   uv run python -m anytimeacquisition.pipelines.train_exit \
#     experiment=action_head_imitation_integrated_regret_kstep_real \
#     pfn_checkpoint=variable_xdim_smoke allow_dirty=true
priors:
  batch_size: 16

trainer:
  # Same 800-rollout first-real-scale sizing as
  # action_head_imitation_integrated_real.yaml -- the regret gate
  # (require_regret_improvement) means a larger fraction of raw corrections
  # get discarded than that baseline run saw (798/1429 survived in this
  # session's measurement, see docs/MILESTONES.md), so this is not
  # expected to produce MORE training signal per rollout, just better-
  # trusted signal; scale up rollouts from here once auc_improvement_vs_random
  # is checked against this baseline, not preemptively.
  n_rollouts: 800
  n_init: 10
  n_steps: 40
  log_every: 100
  exploit_search_kwargs:
    n_restarts: 4
    n_steps: 15
  explore_search_kwargs:
    n_restarts: 1
    n_steps: 15
  max_explore_steps_per_rollout: 8
  require_regret_improvement: true
  explore_k: 3
  round_dependent_seeding: true
  realized_seed_min_self_generated: 0.7
  checkpoint_path: ${aa_root:}/models/action_head_imitation_integrated_regret_kstep_real.pt

build_interesting_points_kwargs:
  n_sobol: 64
  n_random: 64
  n_basin_restarts: 24

action_head:
  d_model: 64
  n_heads: 4
  d_ff: 128
  dropout: 0.0
