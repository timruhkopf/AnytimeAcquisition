# @package _global_
# Real-scale (not smoke) marginal explore-only ActionHead behavior-cloning
# run, sized for pfn_variable_xdim_smoke.pt's x_dim=6 -- pair with
# pfn_checkpoint=variable_xdim_smoke on the CLI.
#
#   uv run python -m anytimeacquisition.pipelines.train_exit \
#     experiment=action_head_imitation_explore_real pfn_checkpoint=variable_xdim_smoke allow_dirty=true
priors:
  batch_size: 16

trainer:
  # 800 rollouts is a first real-scale run, not the final target -- meant
  # to be scaled up once this confirms sane, learning-shaped metrics (see
  # docs/log/ discussion, 2026-09-01). At ~30-45s/rollout estimated post-
  # subsampling (measured cost dropped roughly 4-5x, see
  # max_explore_steps_per_rollout below), this is an overnight run, not
  # multi-day. log_every kept fine (10) for the cheap built-in metrics
  # (policy_nll/train, grad_norm, ...); the expensive held-out checks
  # (held_out_l1/auc_eval/blind_ablation) have their own, coarser,
  # decoupled cadence (configs/train_exit.yaml).
  n_rollouts: 800
  n_init: 10
  n_steps: 40
  log_every: 10
  # null = exploit branch off (2026-09-02, no separate `branches` value).
  exploit_search_kwargs: null
  explore_search_kwargs:
    n_restarts: 1
    n_steps: 15
  # ~35-40 of the 40 rollout steps are explore-eligible at this scale
  # (measured 2026-09-01) -- each explore_search call costs a real PFN
  # forward+backward per its own n_steps, so this was the dominant cost
  # (~2.3min/rollout measured, unworkable at n_rollouts=1500). Capping to
  # 8 randomly-chosen steps per rollout cuts that cost roughly 4-5x;
  # unselected steps simply get no explore example this rollout (0 loss),
  # same treatment has_signal=False already gets.
  max_explore_steps_per_rollout: 8
  checkpoint_path: ${aa_root:}/models/action_head_imitation_explore_real.pt

build_interesting_points_kwargs:
  n_sobol: 64
  n_random: 64
  n_basin_restarts: 24

action_head:
  d_model: 64
  n_heads: 4
  d_ff: 128
  dropout: 0.0
