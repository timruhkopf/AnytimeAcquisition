# @package _global_
# Small/fast smoke checkpoint for the causal PFN, not a serious training
# run -- mirrors configs/experiment/pfn_smoke_xdim2.yaml's own settings so
# the two are a fair architecture comparison at matched scale/budget.
# Run: uv run python -m anytimeacquisition.pipelines.train_pfn_causal experiment=pfn_causal_smoke_xdim2
priors:
  x_dim: 2
  batch_size: 32
models:
  surrogates:
    d_model: 64
    n_layers: 3
    n_bins: 64
trainer:
  n_steps: 500
  log_every: 50
  checkpoint_path: ${aa_root:}/models/pfn_causal_smoke_xdim2.pt
