# @package _global_
# Small/fast smoke checkpoint exercising variable x_dim end-to-end:
# priors.variable_dim_min turns on BNNPrior's active_dim (docs/log/,
# priors/bnn.py's constructor comment), and PFNTrainer already passes that
# straight through as models/pfn.py's PFN.forward n_features -- so every
# training STEP's whole batch shares one real x_dim, uniformly resampled
# fresh in [variable_dim_min, priors.x_dim] each step (batch-uniform, not
# per-instance -- see docs/log/2026-08-31-variable-xdim-training-
# stagnation.md for why), padded up to the model's max_x_dim = priors.x_dim
# ceiling (configs/models/surrogates/pfn.yaml).
# Not a serious training run -- see docs/milestones/M2.md and pfn_smoke_xdim2.yaml
# for what a real run should look like; this one is purely for exercising
# the variable-x_dim capability, at priors.x_dim=4 so there's room for
# active_dim to actually vary (1..4) step to step.
# Run: uv run python -m anytimeacquisition.pipelines.train_pfn experiment=pfn_variable_xdim_smoke
priors:
  x_dim: 6
  batch_size: 32
  variable_dim_min: 1
models:
  surrogates:
    d_model: 64
    n_layers: 4
    n_bins: 64
trainer:
  n_steps: 500
  log_every: 50
  checkpoint_path: ${aa_root:}/models/pfn_variable_xdim_smoke.pt
# Per-dimension validation (docs/log/2026-08-31-variable-xdim-training-
# stagnation.md): does NLL/eval_mse actually get worse at higher
# dimensionality (expected), on top of whatever caused popular-pig's
# stagnation -- callbacks/dim_validation.py, logged as nll/val_dim{1..4}
# and mse/val_dim{1..4} alongside the trainer's own nll/train, mse/train
# (metric-type first, so MLflow groups all nll curves together, all mse
# curves together).
validate_dims: [1, 2, 3, 4, 5, 6]
